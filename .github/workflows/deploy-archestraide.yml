name: Deploy ArchestrAide to GitHub Pages

# Builds the ArchestrAide MVP (in /archestraide) as a static export and deploys
# it to GitHub Pages. The app works fully client-side, so the optional /api/ask
# serverless route is removed for the static build and the client falls back to
# the deterministic grounded answer composer.

on:
  push:
    branches:
      - claude/archestraaide-aveva-copilot-qle9dj
    paths:
      - "archestraide/**"
      - ".github/workflows/deploy-archestraide.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: archestraide
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: archestraide/package-lock.json

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        env:
          STATIC_EXPORT: "true"
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          rm -rf app/api
          npm run build
          touch out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: archestraide/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
